<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Olist</title>
<meta name="description" content="Ask questions about 100,000 e-commerce orders. An agent writes read-only SQL and shows its work.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/ask">Ask Olist</a>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <section id="recent-section" class="recent" hidden>
      <div class="recent-head">
        <h2 class="rail-title">Recent questions</h2>
        <button id="clear-recent" type="button" class="button button-quiet">Clear</button>
      </div>
      <ul id="recent" class="recent-list"></ul>
    </section>
    <div id="rail-footer" class="rail-footer">
      <div id="status" class="status"></div>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript>Ask Olist needs JavaScript to run.</noscript>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
