name: Eval (manual)

# Runs the 50 reference questions against a live model.
# Needs the repository secret LLM_API_KEY; start it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM_PROVIDER (groq, gemini, openrouter, anthropic)
        default: groq
      model:
        description: LLM_MODEL (empty for the provider default)
        default: ""
      tpm:
        description: Tokens-per-minute budget
        default: "8000"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: ${{ inputs.provider }}
      LLM_MODEL: ${{ inputs.model }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/build_db.py --download
      - run: python -m sqlagent eval --oracle
      - run: python -m sqlagent eval --fresh --tpm ${{ inputs.tpm }}
      - run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
