# Render blueprint: New > Blueprint, pick this repository, then set LLM_API_KEY when asked.
services:
  - type: web
    name: ask-olist
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false          # entered in the dashboard, never committed
      - key: DAILY_TOKEN_BUDGET
        value: "150000"      # keeps a public demo under the provider's free daily cap
      - key: TRUST_PROXY
        value: "1"
      - key: APP_PASSWORD
        sync: false          # optional: set it to keep the workspace private
